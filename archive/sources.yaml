# Which customer each archive file belongs to, for build_reservoir.py.
# Importance = number of DISTINCT customers asking a question, so copies and
# follow-ups of the same customer's questionnaire must share one customer name.
#   customer: name used for counting (files with the same name count once)
#   include:  false = not a questionnaire, or a duplicate/merge of other files
#   answers:  false = count its questions, but never reuse its answers (e.g. an
#             answer.py output that wasn't reviewed before it was sent)
# Files missing from this list are counted as their own customer (file name),
# and build_reservoir.py prints a reminder to tag them here.

